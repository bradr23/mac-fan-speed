name: Release

# Publishing a tag builds the app and attaches it to a GitHub release, so people
# can download a ready-to-run .app instead of building it themselves. Binaries
# are never committed to the repository — they belong to a release, not to
# history.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the app version
        # A tag that disagrees with CFBundleShortVersionString produces a release
        # whose filename and contents contradict each other.
        run: |
          BUNDLE="$(plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          if [ "$BUNDLE" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag is ${{ steps.version.outputs.tag }} but Info.plist says $BUNDLE"
            exit 1
          fi
          echo "tag and bundle version agree: $BUNDLE"

      - name: Build the release archive
        run: ./scripts/release.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="$(cut -d' ' -f1 < "dist/MacFanSpeed-$VERSION.zip.sha256")"

          cat > notes.md <<NOTES
          ## Install

          1. Download **MacFanSpeed-$VERSION.zip** below and unzip it.
          2. Drag **MacFanSpeed.app** to your Applications folder.
          3. **Right-click the app and choose Open**, then confirm.

          That third step is needed because the app is ad-hoc signed rather than
          signed with a paid Apple Developer ID, so macOS quarantines the
          download. You only have to do it once. The alternative is
          \`xattr -dr com.apple.quarantine /Applications/MacFanSpeed.app\`.

          To change fan speeds, open **Settings › Fan Control › Install Helper**
          and enter your password once. Monitoring works without it.

          ## Requirements

          Apple Silicon Mac (M1 or later), macOS 14 Sonoma or later.

          ## Verifying the download

          \`\`\`
          shasum -a 256 MacFanSpeed-$VERSION.zip
          \`\`\`

          Expected: \`$SHA\`
          NOTES

          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/MacFanSpeed-$VERSION.zip" \
            "dist/MacFanSpeed-$VERSION.zip.sha256" \
            --title "Mac Fan Speed $VERSION" \
            --notes-file notes.md
